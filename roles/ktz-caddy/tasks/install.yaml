---

- name: add gpo apt repo
  ansible.builtin.apt_repository:
    repo: 'ppa:longsleep/golang-backports'

- name: install required packages
  ansible.builtin.apt:
    pkg: golang-go
    state: present
    update_cache: yes

- name: install xcaddy
  ansible.builtin.apt:
    deb: "{{ xcaddy_binary_url }}"

- name: build caddy
  ansible.builtin.command:
    cmd: xcaddy build latest --with github.com/caddy-dns/cloudflare --with github.com/WeidiDeng/caddy-cloudflare-ip --output /usr/local/bin/caddy
  changed_when: true  # always rebuilds the binary

- name: create caddy config folder
  ansible.builtin.file:
    path: "{{ caddy_data_path }}/caddy"
    state: directory
    mode: '0755'

- name: create caddy logs folder
  ansible.builtin.file:
    path: "{{ caddy_log_path }}"
    state: directory
    mode: '0755'
