---

- name: ensure hostname is set correctly
  hostname:
    name: "{{ hostname_proxmox }}"

- name: disks
  include_tasks: disks.yaml
  tags:
    - disks

- name: ensure group "render" has correct gid
  ansible.builtin.group:
    name: render
    state: present
    gid: "{{ render_gid }}"

- name: ensure render device has correct group (udev rule)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render"
    dest: /etc/udev/rules.d/99-render-group.rules
    owner: root
    group: root
    mode: "0644"
  notify: apply udev rules

- name: add group "lxc" exists with correct gid
  ansible.builtin.group:
    name: lxc
    state: present
    gid: "{{ lxc_gid }}"

- name: add user 'lxc' exists with the correct uid
  ansible.builtin.user:
    name: lxc
    uid: "{{ lxc_uid }}"
    shell: /usr/sbin/nologin
    create_home: false
    group: render
