---

- name: ensure target dirs exists
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dnsmasq_config_dir }}"

- name: write dnsmasq.conf
  copy:
    content: "conf-dir={{ dnsmasq_config_dir }}"
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: write dns file
  template:
    src: dns.conf.j2
    dest: "{{ dnsmasq_config_dir }}/01-dns.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: write static dhcp file
  template:
    src: static-dhcp.conf.j2
    dest: "{{ dnsmasq_config_dir }}/02-static-dhcp.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: write dns overrides file
  template:
    src: dns-overrides.conf.j2
    dest: "{{ dnsmasq_config_dir }}/03-dns-overrides.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: write resolv.conf
  template:
    src: resolv.conf.j2
    dest: "/etc/resolv.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

# fail here, before the restart handler runs, if the config is broken
- name: validate dnsmasq configuration
  ansible.builtin.command: dnsmasq --test -C /etc/dnsmasq.conf
  changed_when: false
