---

hostname: "{{ hosts.lounge.hostname }}"
hostname_lounge: "{{ hostname }}"

## deev-pkg
package_list:
  - gpg
  - python3-pip

## ironicbadger.docker_compose_generator
appdata_path: /mnt/appdata
wwwdata_path: /mnt/www-data

containers:
  - service_name: ghost
    active: true
    image: ghost:5-alpine
    network_mode: host
    volumes:
      - "{{ appdata_path }}/ghost:/var/lib/ghost/content"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "database__client=sqlite3"
      - "database__connection__filename=\"content/data/ghost.db\""
      - "database__useNullAsDefault=true"
      - "database__debug=false"
      - "url=https://ghost.lounge.{{ default_domain }}"
      - "mail__from={{ ghost_mail_from }}"
      - "mail__transport=SMTP"
      - "mail__options__host=smtp.resend.com"
      - "mail__options__port=465"
      - "mail__options__auth__user=resend"
      - "mail__options__auth__pass={{ ghost_mail_api_key }}"
      - "mail__options__secure_connection=false"

  - service_name: drone-server
    active: true
    image: drone/drone:latest
    network_mode: host
    volumes:
      - "{{ appdata_path }}/drone-data:/data/"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "DRONE_GITHUB_SKIP_VERIFY=true"
      - "DRONE_SERVER_HOST=drone.{{ domain_deev }}"
      - "DRONE_SERVER_PROTO=https"
      - "DRONE_TLS_AUTOCERT=false"
      - "DRONE_GITHUB=true"
      - "DRONE_USER_CREATE=username:{{ drone_github_user }},machine:false,admin:true,token:{{ drone_github_token }}"
      - "DRONE_USER_FILTER={{ drone_github_user }}"
      - "DRONE_GITHUB_CLIENT_ID={{ drone_github_client_id }}"
      - "DRONE_GITHUB_CLIENT_SECRET={{ drone_github_client_secret }}"
      - "DRONE_RPC_SECRET={{ drone_rpc_secret }}"

  - service_name: drone-docker-agent
    active: true
    image: drone/drone-runner-docker:latest
    network_mode: host
    depends_on:
      - drone-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ wwwdata_path }}:{{ wwwdata_path }}"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "DRONE_RPC_PROTO=https"
      - "DRONE_RPC_HOST=drone.{{ domain_deev }}"
      - "DRONE_RPC_SECRET={{ drone_rpc_secret }}"

  - service_name: matomo-db
    active: true
    image: mariadb:10.11
    command: "--max-allowed-packet=64MB"
    volumes:
      - "{{ appdata_path }}/matomo/db:/var/lib/mysql:Z"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "MYSQL_ROOT_PASSWORD={{ matomo_mariadb_root_password }}"
      - "MARIADB_DISABLE_UPGRADE_BACKUP=1"
      - "MYSQL_PASSWORD={{ matomo_mariadb_password }}"
      - "MYSQL_DATABASE=matomo"
      - "MYSQL_USER=matomo"
      - "MATOMO_DATABASE_ADAPTER=mysql"
      - "MATOMO_DATABASE_TABLES_PREFIX=matomo_"
      - "MATOMO_DATABASE_USERNAME=matomo"
      - "MATOMO_DATABASE_PASSWORD={{ matomo_mariadb_db_password }}"
      - "MATOMO_DATABASE_DBNAME=matomo"
      - "MARIADB_AUTO_UPGRADE=1"
      - "MARIADB_INITDB_SKIP_TZINFO=1"

  - service_name: matomo-app
    active: true
    image: matomo:fpm-alpine
    volumes:
      - "{{ appdata_path }}/matomo/config:/var/www/html/config:z"
      - "{{ appdata_path }}/matomo/www-data:/var/www/html:z"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "MATOMO_DATABASE_HOST=matomo-db"
      - "PHP_MEMORY_LIMIT=2048M"
      - "MYSQL_PASSWORD={{ matomo_mariadb_password }}"
      - "MYSQL_DATABASE=matomo"
      - "MYSQL_USER=matomo"
      - "MATOMO_DATABASE_ADAPTER=mysql"
      - "MATOMO_DATABASE_TABLES_PREFIX=matomo_"
      - "MATOMO_DATABASE_USERNAME=matomo"
      - "MATOMO_DATABASE_PASSWORD={{ matomo_mariadb_db_password }}"
      - "MATOMO_DATABASE_DBNAME=matomo"
      - "MARIADB_AUTO_UPGRADE=1"
      - "MARIADB_INITDB_SKIP_TZINFO=1"

  - service_name: matomo-nginx
    active: true
    image: nginx:alpine
    volumes:
      - "{{ appdata_path }}/matomo/www-data:/var/www/html:z,ro"
      - "{{ appdata_path }}/matomo/matomo.conf:/etc/nginx/conf.d/default.conf:z,ro"
    include_global_env_vars: true
    restart: unless-stopped
    ports:
      - 8080:80

  - service_name: paperless-redis
    active: false
    image: docker.io/library/redis:7
    volumes:
      - "{{ appdata_path }}/paperless-redis:/data"
    include_global_env_vars: true
    restart: unless-stopped

  - service_name: paperless
    active: false
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - paperless-redis
    volumes:
      - "{{ appdata_path }}/paperless/data:/usr/src/paperless/data"
      - "{{ appdata_path }}/paperless/media:/usr/src/paperless/media"
      - "{{ appdata_path }}/paperless/export:/usr/src/paperless/export"
      - "{{ appdata_path }}/paperless/consume:/usr/src/paperless/consume"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "PAPERLESS_REDIS=redis://paperless-redis:6379"
      - "PAPERLESS_URL=https://paperless.{{ domain_deev }}"
      - "PAPERLESS_SECRET_KEY={{ paperless_secret }}"
      - "PAPERLESS_OCR_LANGUAGES=en por"
      - "PAPERLESS_TIME_ZONE={{ ntp_timezone }}"
    ports:
      - 8000:8000

  - service_name: mealie-frontend
    active: false
    image: hkotel/mealie:frontend-nightly
    volumes:
      - "{{ appdata_path }}/mealie:/app/data"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "API_URL=http://mealie-api:9000"
    ports:
      - 9925:3001

  - service_name: mealie-api
    active: false
    image: hkotel/mealie:api-nightly
    volumes:
      - "{{ appdata_path }}/mealie:/app/data"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "ALLOW_SIGNUP=false"
      - "MAX_WORKERS=1"
      - "WEB_CONCURRENCY=1"
      - "BASE_URL=https://mealie.{{ domain_deev }}"
      - "PUID=1000"
      - "PGID=1000"

  - service_name: vrising
    active: false
    image: trueosiris/vrising
    volumes:
      - "{{ appdata_path }}/vrising/server:/mnt/vrising/server:rw"
      - "{{ appdata_path }}/vrising/data:/mnt/vrising/persistentdata:rw"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "SERVERNAME=Cafezinho"
      - "WORLDNAME=cafezinho"
      - "GAMEPORT=27015"
      - "QUERYPORT=27016"
    ports:
      - 9876:9876/udp
      - 9877:9877/udp
      - 27015:27015/udp
      - 27016:27016/udp

  - service_name: minecraft
    active: false
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    volumes:
      - "{{ appdata_path }}/minecraft:/data"
    include_global_env_vars: true
    restart: unless-stopped
    ports:
      - 25565:25565/udp
      - 25565:25565/tcp
      - 8100:8100/tcp
    environment:
      - "EULA=TRUE"
      - "TYPE=PURPUR"
      - "VERSION=1.21.1"
      - "VIEW_DISTANCE=10"
      - "SIMULATION_DISTANCE=10"
      - "SERVER_NAME=Lounge"
      - "OPS=Deevian"
      - "WHITELIST=Deevian,I_Dauntless_I"
      - "ENABLE_AUTOPAUSE=true"
      - "MAX_TICK_TIME=-1"
      - "MOTD=Is this a minecraft server?"
      - "ICON=https://cdn.discordapp.com/app-icons/668111785580036113/7bebe98df8bed07e83efe5dbd2380460.png"
      - "OVERRIDE_ICON=TRUE"
      - "JVM_OPTS=-Xms4G -Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -Ddisable.watchdog=true"

  - service_name: runescape-dragonwilds
    active: true
    image: indifferentbroccoli/runescape-dragonwilds-server-docker
    volumes:
      - "{{ appdata_path }}/dragonwilds:/home/steam/server-files"
    include_global_env_vars: true
    restart: unless-stopped
    ports:
      - 7777:7777/udp
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "UPDATE_ON_START=true"
      - "OWNER_ID=0002a11fbcde43e5979790bf861e5129"
      - "SERVER_NAME=Macarena"
      - "DEFAULT_WORLD_NAME=Sonder"
      - "ADMIN_PASSWORD=macarenamacarena"
      - "WORLD_PASSWORD=macarena"
      - "DEFAULT_PORT=7777"
      - "MAX_PLAYERS=6"
