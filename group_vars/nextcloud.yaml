---

hostname: "{{ hosts.nextcloud.hostname }}"
hostname_nextcloud: "{{ hostname }}"

## deev-pkg
package_list:
  - gpg
  - python3-pip

## ironicbadger.docker_compose_generator
appdata_path: /mnt/appdata
data_path: /mnt/data

containers:
  - service_name: mariadb
    active: true
    image: mariadb:10.11
    command: "--transaction-isolation=READ-COMMITTED"
    volumes:
      - "{{ appdata_path }}/db:/var/lib/mysql:Z"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "MYSQL_ROOT_PASSWORD={{ nextcloud_db_root_password }}"
      - "MYSQL_PASSWORD={{ nextcloud_db_user_password }}"
      - "MYSQL_DATABASE=nextcloud"
      - "MYSQL_USER=nextcloud"
      - "MARIADB_AUTO_UPGRADE=1"
      - "MARIADB_DISABLE_UPGRADE_BACKUP=1"

  - service_name: redis
    active: true
    image: redis:alpine
    include_global_env_vars: true
    restart: unless-stopped

  - service_name: nextcloud
    active: true
    image: nextcloud:fpm
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - "{{ appdata_path }}/nextcloud:/var/www/html:z"
      - "{{ data_path }}/:/data"
    include_global_env_vars: true
    restart: unless-stopped
    environment:
      - "MYSQL_PASSWORD={{ nextcloud_db_user_password }}"
      - "MYSQL_DATABASE=nextcloud"
      - "MYSQL_USER=nextcloud"
      - "MYSQL_HOST=mariadb"
      - "REDIS_HOST=redis"
    depends_on:
      - mariadb
      - redis

  - service_name: nginx
    active: true
    image: nginx:alpine
    volumes:
      - "{{ appdata_path }}/nextcloud:/var/www/html:z,ro"
      - "{{ appdata_path }}/nginx.conf:/etc/nginx/nginx.conf:z,ro"
    include_global_env_vars: true
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - 80:80

  - service_name: cron
    active: true
    image: nextcloud:fpm
    include_global_env_vars: true
    restart: unless-stopped
    volumes:
      - "{{ appdata_path }}/nextcloud:/var/www/html:z"
      - "{{ data_path }}/:/data"
      - "{{ appdata_path }}/nginx.conf:/etc/nginx/nginx.conf:z,ro"
    entrypoint: /cron.sh
    depends_on:
      - mariadb
      - redis
